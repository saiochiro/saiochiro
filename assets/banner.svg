<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0816"/>
      <stop offset="0.6" stop-color="#1c1236"/>
      <stop offset="1" stop-color="#0b0816"/>
    </linearGradient>
    <radialGradient id="torch" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cellglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3fd0c9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3fd0c9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bricks" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#191230"/>
      <rect x="1" y="1" width="22" height="10" fill="#211940"/>
      <rect x="25" y="1" width="22" height="10" fill="#1e163a"/>
      <rect x="13" y="13" width="22" height="10" fill="#221a42"/>
      <rect x="-11" y="13" width="22" height="10" fill="#1f173c"/>
      <rect x="37" y="13" width="22" height="10" fill="#1f173c"/>
    </pattern>
    <style>
      .title { font-family: 'Press Start 2P', 'Silkscreen', 'Courier New', monospace; font-size: 46px; letter-spacing: 6px; fill: #f3e7c9; }
      .sub { font-family: 'Press Start 2P', 'Silkscreen', 'Courier New', monospace; font-size: 14px; letter-spacing: 3px; fill: #3fd0c9; }
      .flame { fill: #ffb347; }
      .core { fill: #ffe27a; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- distant castle silhouette -->
  <path fill="#150f2a" d="M0 220 V170 H40 V150 H56 V170 H96 V130 H112 V110 H128 V130 H144 V170 H220 V140 H236 V170 H300 V120 H316 V90 H324 V80 H332 V90 H340 V120 H356 V170 H460 V150 H476 V170 H700 V150 H716 V170 H820 V120 H836 V90 H844 V80 H852 V90 H860 V120 H876 V170 H960 V140 H976 V170 H1052 V130 H1068 V110 H1084 V130 H1100 V170 H1144 V150 H1160 V170 H1200 V220 Z"/>

  <!-- brick side pillars -->
  <rect x="0" y="0" width="150" height="320" fill="url(#bricks)"/>
  <rect x="1050" y="0" width="150" height="320" fill="url(#bricks)"/>
  <rect x="146" y="0" width="8" height="320" fill="#0b0816"/>
  <rect x="1046" y="0" width="8" height="320" fill="#0b0816"/>

  <!-- hanging chains -->
  <g fill="#4a3f6b">
    <rect x="250" y="0" width="6" height="8"/><rect x="248" y="10" width="10" height="6"/><rect x="250" y="18" width="6" height="8"/><rect x="248" y="28" width="10" height="6"/><rect x="250" y="36" width="6" height="8"/><rect x="248" y="46" width="10" height="6"/><rect x="250" y="54" width="6" height="8"/>
    <rect x="944" y="0" width="6" height="8"/><rect x="942" y="10" width="10" height="6"/><rect x="944" y="18" width="6" height="8"/><rect x="942" y="28" width="10" height="6"/><rect x="944" y="36" width="6" height="8"/><rect x="942" y="46" width="10" height="6"/><rect x="944" y="54" width="6" height="8"/><rect x="942" y="64" width="10" height="6"/><rect x="944" y="72" width="6" height="8"/>
  </g>
  <g fill="#6b5f8f">
    <rect x="244" y="62" width="18" height="6"/><rect x="938" y="80" width="18" height="6"/>
  </g>

  <!-- torches on pillars -->
  <g>
    <circle cx="75" cy="120" r="90" fill="url(#torch)">
      <animate attributeName="r" values="86;96;84;92;86" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="68" y="128" width="14" height="30" fill="#5a3b22"/>
    <rect x="62" y="124" width="26" height="8" fill="#7a5230"/>
    <g>
      <rect class="flame" x="66" y="104" width="18" height="20"/>
      <rect class="flame" x="70" y="96" width="10" height="8"/>
      <rect class="core" x="71" y="110" width="8" height="12"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;1 0;0 -1;0 0" dur="0.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <g>
    <circle cx="1125" cy="120" r="90" fill="url(#torch)">
      <animate attributeName="r" values="92;84;96;86;92" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <rect x="1118" y="128" width="14" height="30" fill="#5a3b22"/>
    <rect x="1112" y="124" width="26" height="8" fill="#7a5230"/>
    <g>
      <rect class="flame" x="1116" y="104" width="18" height="20"/>
      <rect class="flame" x="1120" y="96" width="10" height="8"/>
      <rect class="core" x="1121" y="110" width="8" height="12"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 -2;0 0" dur="0.55s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- stone floor -->
  <rect x="0" y="272" width="1200" height="48" fill="#120c24"/>
  <g fill="#1e1638">
    <rect x="0" y="272" width="1200" height="4"/>
    <rect x="40" y="284" width="60" height="6"/><rect x="180" y="296" width="80" height="6"/><rect x="340" y="284" width="50" height="6"/>
    <rect x="480" y="298" width="90" height="6"/><rect x="640" y="286" width="60" height="6"/><rect x="790" y="300" width="70" height="6"/>
    <rect x="920" y="286" width="55" height="6"/><rect x="1060" y="298" width="80" height="6"/>
  </g>

  <!-- rising teal orbs -->
  <g>
    <g><circle cx="300" cy="262" r="10" fill="url(#cellglow)"/><rect x="297" y="259" width="6" height="6" fill="#bff7f3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -170" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/></g>
    <g><circle cx="420" cy="266" r="8" fill="url(#cellglow)"/><rect x="418" y="264" width="4" height="4" fill="#bff7f3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -190" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="7.5s" repeatCount="indefinite"/></g>
    <g><circle cx="560" cy="262" r="10" fill="url(#cellglow)"/><rect x="557" y="259" width="6" height="6" fill="#bff7f3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -160" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="5.5s" repeatCount="indefinite"/></g>
    <g><circle cx="660" cy="266" r="8" fill="url(#cellglow)"/><rect x="658" y="264" width="4" height="4" fill="#bff7f3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -200" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite"/></g>
    <g><circle cx="780" cy="262" r="10" fill="url(#cellglow)"/><rect x="777" y="259" width="6" height="6" fill="#bff7f3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -175" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="6.5s" repeatCount="indefinite"/></g>
    <g><circle cx="900" cy="266" r="8" fill="url(#cellglow)"/><rect x="898" y="264" width="4" height="4" fill="#bff7f3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -185" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite"/></g>
  </g>

  <!-- title -->
  <text class="title" x="604" y="152" text-anchor="middle" fill="#3a1a12">SAI</text>
  <text class="title" x="600" y="148" text-anchor="middle">SAI</text>
  <g fill="#ff8a3d">
    <rect x="380" y="180" width="440" height="4"/>
    <rect x="596" y="174" width="8" height="16"/>
  </g>
  <text class="sub" x="600" y="220" text-anchor="middle">DIE · LEARN · SHIP · REPEAT</text>
</svg>
